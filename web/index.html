        window.addEventListener('load', function () {
          // Fallback: Si Flutter no carga en 4 segundos, forzamos remover el loader
          // Esto ayuda si hay un error silencioso o si la carga es muy lenta.
          setTimeout(function () {
            var loading = document.getElementById('loading');
            if (loading) {
              loading.style.opacity = '0'; // Desvanecer
              setTimeout(function () {
                if (loading.parentNode) loading.parentNode.removeChild(loading);
              }, 500);
            }
          }, 5); // 3 segundos de espera máxima
