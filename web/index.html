  <!-- ――― Open Graph / Redes Sociales ――― -->

  <!-- ――― Twitter Cards ――― -->

    content="Programador web y edición de videos. Este es mi trabajo como Josías Jofré." />

  <!-- ――― PWA / iOS meta tags & icons ――― -->

  <meta name="apple-mobile-web-app-title" content="Portafolio" />

  <!-- ――― Favicon y Manifest ――― -->
  <link rel="icon" href="favicon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="canonical" href="https://iamjosiah.cl" />
  <meta name="theme-color" content="#0B1220" />
  <style>
    html, body { margin: 0; background: #0B1220; }

    /* Loader inicial: se quita apenas Flutter pinta su primer frame */
    .loading-container {
      position: fixed;
      inset: 0;
      background: #0B1220;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.2s ease-out;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: #22D3EE;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2s; }
    }
  </style>
</head>

<body>
  <!-- Loader visible antes de que Flutter arranque -->
  <div class="loading-container" id="loading">
    <div class="spinner"></div>
  </div>

  <script>
    (function () {
      var removed = false;
      function hideLoader() {
        if (removed) return;
        removed = true;
        var loading = document.getElementById('loading');
        if (!loading) return;
        loading.style.opacity = '0';
        setTimeout(function () {
          if (loading.parentNode) loading.parentNode.removeChild(loading);
        }, 200);
      }
      // Flutter emite este evento al pintar el primer frame.
      window.addEventListener('flutter-first-frame', hideLoader);
      // Respaldo por si el evento no llega (error silencioso).
      setTimeout(hideLoader, 8000);
    })();
  </script>
  <!-- Bootstrap de Flutter Web -->
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
